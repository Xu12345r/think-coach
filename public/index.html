<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>思维教练 · 现代思维工具100讲</title>
<meta name="description" content="基于万维钢《现代思维工具100讲》的私人思维教练——把纠结变成判断，把判断变成行动。">
<meta property="og:title" content="思维教练 · 现代思维工具100讲">
<meta property="og:description" content="用 100 个现代思维工具，帮你分析决策、判断风险、规划成长。">
<style>
:root{
  --bg:#05070f;
  --bg2:#0a0e22;
  --card:rgba(255,255,255,.04);
  --stroke:rgba(255,255,255,.09);
  --primary:#7c6cff;
  --primary2:#a86cff;
  --accent:#3ee6ff;
  --text:#eceefb;
  --text-dim:#8d94b8;
  --text-faint:#5c6286;
  --danger:#ff6b8a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
/* ===== 背景光晕 ===== */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% -10%,#1a1440 0%,transparent 55%),
             radial-gradient(90% 60% at 85% 110%,rgba(124,108,255,.18) 0%,transparent 55%),
             radial-gradient(70% 50% at 10% 100%,rgba(62,230,255,.10) 0%,transparent 50%),
             linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
}
.bg::after{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(80% 60% at 50% 0%,#000 0%,transparent 100%);
  -webkit-mask-image:radial-gradient(80% 60% at 50% 0%,#000 0%,transparent 100%);
}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.orb.a{width:300px;height:300px;background:#4b3dff;top:-80px;right:-60px;animation:float 9s ease-in-out infinite}
.orb.b{width:240px;height:240px;background:#8a2be2;bottom:-60px;left:-50px;animation:float 11s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}

/* ===== 口令屏 ===== */
#gate{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .5s,visibility .5s;
}
#gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-box{width:min(92vw,360px);text-align:center;animation:rise .8s cubic-bezier(.2,.7,.2,1)}
.gate-logo{
  width:72px;height:72px;margin:0 auto 26px;border-radius:22px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 40px rgba(124,108,255,.45),inset 0 1px 0 rgba(255,255,255,.25);
}
.gate-logo svg{width:36px;height:36px}
.gate-title{font-size:24px;font-weight:700;letter-spacing:.5px;margin-bottom:8px;
  background:linear-gradient(120deg,#fff,#c9c4ff 60%,#8ee9ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gate-sub{font-size:13px;color:var(--text-dim);margin-bottom:36px;line-height:1.6}
.gate-sub b{color:var(--accent);font-weight:600}
.gate-input-wrap{position:relative}
.gate-input{
  width:100%;padding:15px 18px;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--text);font-size:16px;text-align:center;
  letter-spacing:6px;outline:none;transition:.25s;
  backdrop-filter:blur(10px);
}
.gate-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,108,255,.15)}
.gate-input::placeholder{letter-spacing:normal;color:var(--text-faint);font-size:14px}
.gate-btn{
  width:100%;margin-top:16px;padding:15px;border-radius:16px;border:none;cursor:pointer;
  font-size:16px;font-weight:600;color:#fff;letter-spacing:2px;
  background:linear-gradient(120deg,var(--primary),var(--primary2));
  box-shadow:0 8px 24px rgba(124,108,255,.35);transition:.2s;
}
.gate-btn:active{transform:scale(.97)}
.gate-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;opacity:0;transition:.2s}
.gate-err.show{opacity:1}
.gate-hint{margin-top:22px;font-size:12px;color:var(--text-faint)}

/* ===== 主界面 ===== */
#app{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{
  padding:16px 20px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--stroke);background:rgba(5,7,15,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.head-logo{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(124,108,255,.4);
}
.head-logo svg{width:22px;height:22px}
.head-txt{flex:1;min-width:0}
.head-txt h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.head-txt p{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head-clear{
  flex-shrink:0;padding:7px 12px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text-dim);font-size:12px;cursor:pointer;transition:.2s;
}
.head-clear:active{background:rgba(255,255,255,.09)}

/* ===== 聊天区 ===== */
#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin-bottom:20px;animation:msgIn .35s cubic-bezier(.2,.7,.2,1)}
.msg.user{justify-content:flex-end}
.msg .avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;margin-right:10px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 3px 10px rgba(124,108,255,.35);
}
.msg.user .avatar{display:none}
.bubble{max-width:82%;position:relative}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;
  font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 6px 20px rgba(124,108,255,.28);
}
.msg.ai .bubble{
  background:var(--card);border:1px solid var(--stroke);border-radius:4px 18px 18px 18px;
  padding:16px 18px;font-size:14.5px;line-height:1.75;color:#d6d9ec;
  backdrop-filter:blur(6px);
}
.msg.ai .bubble.streaming{min-width:60px}

/* markdown 渲染后的样式 */
.ai-md h1,.ai-md h2,.ai-md h3{font-size:15px;font-weight:700;color:#fff;margin:14px 0 8px}
.ai-md h3:first-child{margin-top:0}
.ai-md p{margin:8px 0}
.ai-md strong{color:var(--accent);font-weight:600}
.ai-md ul,.ai-md ol{margin:8px 0;padding-left:20px}
.ai-md li{margin:5px 0}
.ai-md li::marker{color:var(--primary2)}
.ai-md hr{border:none;border-top:1px solid var(--stroke);margin:14px 0}
.ai-md blockquote{border-left:3px solid var(--primary);padding:2px 0 2px 12px;color:var(--text-dim);margin:8px 0}
.ai-md code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;font-size:13px;color:#c9c4ff}
.ai-md a{color:var(--accent)}

/* 思考中动画 */
.thinking{display:flex;gap:5px;padding:4px 2px}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--primary2);animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}
.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ===== 输入区 ===== */
footer{
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(5,7,15,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--stroke);
}
.input-bar{display:flex;align-items:flex-end;gap:10px}
.input-wrap{flex:1;position:relative}
#input{
  width:100%;max-height:120px;min-height:44px;resize:none;padding:12px 16px;
  border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);
  color:var(--text);font-size:15px;line-height:1.5;outline:none;font-family:inherit;
  transition:.25s;
}
#input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,108,255,.12)}
#input::placeholder{color:var(--text-faint)}
#send{
  width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(124,108,255,.35);transition:.2s;
}
#send:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
#send:not(:disabled):active{transform:scale(.92)}
#send svg{width:20px;height:20px}
.foot-note{text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px;letter-spacing:.3px}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div></div>

<!-- 口令屏 -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
      </svg>
    </div>
    <div class="gate-title">思维教练</div>
    <div class="gate-sub">现代思维工具 <b>100</b> 讲 · 万维钢<br>把纠结变成判断，把判断变成行动</div>
    <div class="gate-input-wrap">
      <input class="gate-input" id="passcode" type="password" inputmode="numeric" placeholder="请输入访问口令" maxlength="12" autocomplete="off">
    </div>
    <button class="gate-btn" id="gateBtn">进入</button>
    <div class="gate-err" id="gateErr">口令不对，再试一次</div>
    <div class="gate-hint">口令请向分享者索取</div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="head-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
      </svg>
    </div>
    <div class="head-txt">
      <h1>思维教练</h1>
      <p>现代思维工具100讲 · 万维钢</p>
    </div>
    <button class="head-clear" id="clearBtn">新对话</button>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="把你最近纠结的事告诉我…"></textarea>
      </div>
      <button id="send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
    <div class="foot-note">AI 辅助思考 · 不替代专业意见 · 高风险决策请谨慎</div>
  </footer>
</div>

<script>
/* ===== 轻量 markdown 渲染（不依赖 CDN，支持 AI 输出的常用格式） ===== */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function md2html(md){
  if(!md) return '';
  const lines = String(md).split('\n');
  let html = '', inUl = false, inOl = false;
  function closeLists(){ if(inUl){ html += '</ul>'; inUl = false; } if(inOl){ html += '</ol>'; inOl = false; } }
  for(let line of lines){
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)/))){ closeLists(); const lv = m[1].length; html += `<h${lv}>${mdInline(m[2])}</h${lv}>`; continue; }
    if(/^\s*[-*_]{3,}\s*$/.test(line)){ closeLists(); html += '<hr>'; continue; }
    if((m = line.match(/^\s*[-*]\s+(.*)/))){ if(!inUl){ closeLists(); html += '<ul>'; inUl = true; } html += `<li>${mdInline(m[1])}</li>`; continue; }
    if((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ if(!inOl){ closeLists(); html += '<ol>'; inOl = true; } html += `<li>${mdInline(m[1])}</li>`; continue; }
    if(!line.trim()){ closeLists(); continue; }
    closeLists(); html += `<p>${mdInline(line)}</p>`;
  }
  closeLists();
  return html;
}
</script>
<script>
(function(){
  const WELCOME = "你好，我是你的**思维教练**。\n\n基于万维钢老师《现代思维工具100讲》，我可以帮你分析决策、判断风险、规划成长。\n\n你可以问我任何让你纠结的问题——比如：\n- 「我该不该辞掉稳定的工作去创业？」\n- 「怎么判断现在是换赛道的好时机？」\n- 「这笔钱该投进去还是再等等？」\n- 「我最近状态很差，问题出在哪？」\n\n我会挑最合适的思维工具帮你拆解，给出结论、讲清机制，最后落到**具体能做的行动**上。\n\n试试看，把最近纠结的一件事告诉我。";

  const $ = s => document.querySelector(s);
  const chat = $('#chat'), input = $('#input'), send = $('#send');
  const gate = $('#gate'), passcode = $('#passcode'), gateBtn = $('#gateBtn'), gateErr = $('#gateErr');

  let history = [];   // [{role, content}]
  let unlocked = localStorage.getItem('tc_unlocked') === '1';
  let busy = false;

  // ===== 口令 =====
  function showApp(){
    gate.classList.add('hide');
    if(!history.length){ addAiMsg(WELCOME, false); }
  }
  function tryUnlock(){
    const code = passcode.value.trim();
    if(!code){ gateErr.classList.add('show'); return; }
    fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ passcode:code, question:'' })
    }).then(r=>{
      if(r.status === 400){ // 口令正确（仅问题为空）
        localStorage.setItem('tc_unlocked','1');
        localStorage.setItem('tc_pass', code);
        showApp();
      } else {
        gateErr.classList.add('show');
      }
    }).catch(()=>{ gateErr.classList.add('show'); });
  }
  gateBtn.addEventListener('click', tryUnlock);
  passcode.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  if(unlocked){ showApp(); }

  // ===== 消息渲染 =====
  function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

  function addUserMsg(text){
    const m = document.createElement('div'); m.className='msg user';
    m.innerHTML = '<div class="bubble"></div>';
    m.querySelector('.bubble').textContent = text;
    chat.appendChild(m); scrollBottom();
    history.push({role:'user', content:text});
  }

  function addAiMsg(md, animate){
    const m = document.createElement('div'); m.className='msg ai';
    m.innerHTML = '<div class="avatar">✦</div><div class="bubble"></div>';
    const bubble = m.querySelector('.bubble');
    if(animate){
      bubble.classList.add('streaming');
      bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    } else {
      renderMd(bubble, md);
    }
    chat.appendChild(m); scrollBottom();
    return bubble;
  }

  function renderMd(el, md){
    el.classList.remove('streaming');
    el.innerHTML = '<div class="ai-md">' + (md2html(md) || '') + '</div>';
    scrollBottom();
  }

  // ===== 发送 =====
  function doSend(){
    const q = input.value.trim();
    if(!q || busy) return;
    busy = true; send.disabled = true;
    addUserMsg(q);
    input.value = ''; autoGrow();

    const bubble = addAiMsg('', true);
    let acc = '';

    const hist = history.slice(-8); // 含刚 push 的 user 消息

    fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ passcode: localStorage.getItem('tc_pass')||'', question:q, history:hist })
    }).then(async r=>{
      if(!r.ok){
        let msg = '出错了';
        try{ const j = await r.json(); msg = j.error || msg; }catch(e){}
        renderMd(bubble, '⚠️ **' + msg + '**');
        history.push({role:'assistant', content: msg});
        return;
      }
      // 流式读取
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let first = true;
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        if(first){ bubble.classList.remove('streaming'); bubble.textContent=''; first=false; }
        acc += dec.decode(value, {stream:true});
        bubble.textContent = acc;
        scrollBottom();
      }
      renderMd(bubble, acc);
      history.push({role:'assistant', content: acc});
      // 精简历史：只保留最近 8 条
      if(history.length > 8){ history = history.slice(-8); }
    }).catch(e=>{
      renderMd(bubble, '⚠️ 网络错误，请重试');
    }).finally(()=>{
      busy = false; send.disabled = false; input.focus();
    });
  }

  send.addEventListener('click', doSend);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); doSend(); }
  });
  input.addEventListener('input', ()=>{ send.disabled = !input.value.trim() || busy; autoGrow(); });

  function autoGrow(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,120)+'px';
  }

  $('#clearBtn').addEventListener('click', ()=>{
    if(busy) return;
    history = [];
    chat.innerHTML='';
    addAiMsg(WELCOME, false);
  });

  // 记住本次会话输入的口令（仅内存，用于后续请求）
  passcode.addEventListener('input', ()=>{ localStorage.setItem('tc_pass', passcode.value.trim()); });

  input.focus();
})();
</script>
</body>
</html>
