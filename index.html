<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>思维教练 · AI万sir</title>
<meta name="description" content="基于万维钢《现代思维工具100讲》的私人思维教练——把纠结变成判断，把判断变成行动。">
<meta property="og:title" content="思维教练 · AI万sir">
<meta property="og:description" content="用 100 个现代思维工具，帮你分析决策、判断风险、规划成长。">
<style>
:root{
  --bg:#05070f;
  --bg2:#0a0e22;
  --card:rgba(255,255,255,.04);
  --stroke:rgba(255,255,255,.09);
  --primary:#7c6cff;
  --primary2:#a86cff;
  --accent:#3ee6ff;
  --text:#eceefb;
  --text-dim:#8d94b8;
  --text-faint:#5c6286;
  --danger:#ff6b8a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
/* ===== 背景光晕 ===== */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% -10%,#1a1440 0%,transparent 55%),
             radial-gradient(90% 60% at 85% 110%,rgba(124,108,255,.18) 0%,transparent 55%),
             radial-gradient(70% 50% at 10% 100%,rgba(62,230,255,.10) 0%,transparent 50%),
             linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
}
.bg::after{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(80% 60% at 50% 0%,#000 0%,transparent 100%);
  -webkit-mask-image:radial-gradient(80% 60% at 50% 0%,#000 0%,transparent 100%);
}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.orb.a{width:300px;height:300px;background:#4b3dff;top:-80px;right:-60px;animation:float 9s ease-in-out infinite}
.orb.b{width:240px;height:240px;background:#8a2be2;bottom:-60px;left:-50px;animation:float 11s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}

/* ===== 口令屏 ===== */
#gate{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .5s,visibility .5s;
}
#gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-box{width:min(92vw,360px);text-align:center;animation:rise .8s cubic-bezier(.2,.7,.2,1)}
.gate-logo{
  width:88px;height:88px;margin:0 auto 26px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));
}
.gate-logo svg{width:88px;height:88px;border-radius:50%}
.gate-title{font-size:24px;font-weight:700;letter-spacing:.5px;margin-bottom:8px;
  background:linear-gradient(120deg,#fff,#c9c4ff 60%,#8ee9ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gate-sub{font-size:13px;color:var(--text-dim);margin-bottom:36px;line-height:1.6}
.gate-sub b{color:var(--accent);font-weight:600}
.gate-input-wrap{position:relative}
.gate-input{
  width:100%;padding:15px 18px;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--text);font-size:16px;text-align:center;
  letter-spacing:6px;outline:none;transition:.25s;
  backdrop-filter:blur(10px);
}
.gate-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,108,255,.15)}
.gate-input::placeholder{letter-spacing:normal;color:var(--text-faint);font-size:14px}
.gate-btn{
  width:100%;margin-top:16px;padding:15px;border-radius:16px;border:none;cursor:pointer;
  font-size:16px;font-weight:600;color:#fff;letter-spacing:2px;
  background:linear-gradient(120deg,var(--primary),var(--primary2));
  box-shadow:0 8px 24px rgba(124,108,255,.35);transition:.2s;
}
.gate-btn:active{transform:scale(.97)}
.gate-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;opacity:0;transition:.2s}
.gate-err.show{opacity:1}
.gate-hint{margin-top:22px;font-size:12px;color:var(--text-faint)}
.nick-title{font-size:18px;margin-bottom:6px}
.nick-sub{margin-bottom:22px}
.nick-input{letter-spacing:normal}

/* ===== 主界面 ===== */
#app{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{
  padding:16px 20px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--stroke);background:rgba(5,7,15,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.head-logo{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.head-logo svg{width:38px;height:38px;border-radius:50%}
.head-txt{flex:1;min-width:0}
.head-txt h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.head-txt p{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head-nick{font-weight:600;color:var(--accent);cursor:pointer}
.head-clear{
  flex-shrink:0;padding:7px 12px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text-dim);font-size:12px;cursor:pointer;transition:.2s;
}
.head-clear:active{background:rgba(255,255,255,.09)}

/* ===== 聊天区 ===== */
#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin-bottom:20px;align-items:flex-start;gap:10px;animation:msgIn .35s cubic-bezier(.2,.7,.2,1)}
.msg.user{justify-content:flex-end}
.msg-body{display:flex;flex-direction:column;max-width:82%;min-width:0}
.msg-name{font-size:12px;color:var(--text-faint);margin-bottom:5px;padding:0 4px;letter-spacing:.3px}
.msg.user .msg-name{text-align:right}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;overflow:hidden}
.a-avatar{background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.a-avatar svg{width:100%;height:100%}
.u-avatar{background:linear-gradient(135deg,#3ee6ff,#5b8cff);color:#fff;box-shadow:0 3px 10px rgba(62,230,255,.3)}
.bubble{position:relative}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;
  font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 6px 20px rgba(124,108,255,.28);
  cursor:pointer;
}
.msg.user .bubble:active{transform:scale(.98)}
.msg.ai .bubble{
  background:var(--card);border:1px solid var(--stroke);border-radius:4px 18px 18px 18px;
  padding:16px 18px;font-size:14.5px;line-height:1.75;color:#d6d9ec;
  backdrop-filter:blur(6px);
}
.msg.ai .bubble.streaming{min-width:60px}

/* markdown 渲染后的样式 */
.ai-md h1,.ai-md h2,.ai-md h3{font-size:15px;font-weight:700;color:#fff;margin:14px 0 8px}
.ai-md h3:first-child{margin-top:0}
.ai-md p{margin:8px 0}
.ai-md strong{color:var(--accent);font-weight:600}
.ai-md ul,.ai-md ol{margin:8px 0;padding-left:20px}
.ai-md li{margin:5px 0}
.ai-md li::marker{color:var(--primary2)}
.ai-md hr{border:none;border-top:1px solid var(--stroke);margin:14px 0}
.ai-md blockquote{border-left:3px solid var(--primary);padding:2px 0 2px 12px;color:var(--text-dim);margin:8px 0}
.ai-md code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;font-size:13px;color:#c9c4ff}
.ai-md a{color:var(--accent)}

/* 思考中动画 */
.thinking{display:flex;gap:5px;padding:4px 2px}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--primary2);animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}
.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ===== 输入区 ===== */
footer{
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(5,7,15,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--stroke);
}
.input-bar{display:flex;align-items:flex-end;gap:10px}
.input-wrap{flex:1;position:relative}
#input{
  width:100%;max-height:120px;min-height:44px;resize:none;padding:12px 16px;
  border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);
  color:var(--text);font-size:15px;line-height:1.5;outline:none;font-family:inherit;
  transition:.25s;
}
#input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,108,255,.12)}
#input::placeholder{color:var(--text-faint)}
#send{
  width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(124,108,255,.35);transition:.2s;
}
#send:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
#send:not(:disabled):active{transform:scale(.92)}
#send svg{width:20px;height:20px}
.foot-note{text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px;letter-spacing:.3px}

/* ===== 分享长图按钮 ===== */
.share-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  padding:6px 12px;border-radius:9px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:.2s;
}
.share-btn:active{background:rgba(255,255,255,.12)}
.share-btn svg{width:14px;height:14px}

/* ===== 分享弹窗 ===== */
#shareModal{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px;
}
#shareModal.show{display:block}
.share-box{width:min(94vw,420px);margin:0 auto;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.share-box img{width:100%;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.6);display:block}
.share-img-wrap{position:relative}
.share-x{
  position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;
  border:none;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.share-x:active{transform:scale(.92)}
.share-tip{text-align:center;color:#c9ccdd;font-size:13px;margin-top:14px;letter-spacing:.3px}

/* ===== 消息下方操作按钮组 ===== */
.msg-actions{display:flex;gap:8px;margin-top:12px}
.msg-actions .act-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:9px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:.2s;
}
.msg-actions .act-btn:active{background:rgba(255,255,255,.12)}
.msg-actions .act-btn svg{width:14px;height:14px}

/* ===== toast ===== */
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  padding:10px 20px;border-radius:20px;background:rgba(10,14,34,.92);color:#fff;font-size:14px;
  z-index:300;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.show{opacity:1}

/* ===== 历史会话弹窗 ===== */
#sessionModal{
  position:fixed;inset:0;z-index:102;display:none;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px;
}
#sessionModal.show{display:block}
.session-box{width:min(94vw,420px);margin:0 auto;background:var(--bg2);border:1px solid var(--stroke);border-radius:18px;padding:18px;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.session-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.session-head span{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px}
.session-new{padding:7px 14px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2))}
.session-list{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px}
.session-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.03);cursor:pointer;transition:.15s}
.session-item:active{background:rgba(255,255,255,.08)}
.session-item.active{border-color:var(--primary);background:rgba(124,108,255,.12)}
.s-title{flex:1;min-width:0}
.s-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-meta{font-size:11px;color:var(--text-faint);margin-top:3px}
.s-del{flex-shrink:0;padding:6px 10px;border-radius:8px;border:1px solid var(--stroke);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer}
.s-del:active{color:var(--danger);border-color:var(--danger)}
.session-close{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--text-dim);font-size:14px;cursor:pointer}
.session-empty{padding:24px;text-align:center;color:var(--text-faint);font-size:13px}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
/* ===== 轻量 markdown 渲染（不依赖 CDN，支持 AI 输出的常用格式） ===== */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function md2html(md){
  if(!md) return '';
  const lines = String(md).split('\n');
  let html = '', inUl = false, inOl = false;
  function closeLists(){ if(inUl){ html += '</ul>'; inUl = false; } if(inOl){ html += '</ol>'; inOl = false; } }
  for(let line of lines){
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)/))){ closeLists(); const lv = m[1].length; html += `<h${lv}>${mdInline(m[2])}</h${lv}>`; continue; }
    if(/^\s*[-*_]{3,}\s*$/.test(line)){ closeLists(); html += '<hr>'; continue; }
    if((m = line.match(/^\s*[-*]\s+(.*)/))){ if(!inUl){ closeLists(); html += '<ul>'; inUl = true; } html += `<li>${mdInline(m[1])}</li>`; continue; }
    if((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ if(!inOl){ closeLists(); html += '<ol>'; inOl = true; } html += `<li>${mdInline(m[1])}</li>`; continue; }
    if(!line.trim()){ closeLists(); continue; }
    closeLists(); html += `<p>${mdInline(line)}</p>`;
  }
  closeLists();
  return html;
}

/* markdown 转纯文本（用于复制） */
function md2text(md){
  if(!md) return '';
  return String(md)
    .replace(/\*\*([^*]+)\*\*/g, '$1')          // 去加粗
    .replace(/^#{1,3}\s+/gm, '')                 // 去标题标记
    .replace(/^\s*[-*]\s+/gm, '• ')              // 无序列表转圆点
    .replace(/^\s*\d+[.)]\s+/gm, '')             // 去有序列表序号
    .replace(/`([^`]+)`/g, '$1')                 // 去行内代码
    .replace(/[*_]/g, '')                        // 去斜体等残留标记
    .trim();
}

/* ===== 长图生成（markdown 解析 + canvas 绘制，无外部依赖） ===== */
function mdToBlocks(md){
  const lines = String(md).split('\n');
  const blocks = [];
  let listBuf = [], listType = null;
  function flush(){ if(listBuf.length){ blocks.push({type:listType, items:listBuf.slice()}); listBuf=[]; listType=null; } }
  for(const line of lines){
    let m;
    if(/^\s*[-*_]{3,}\s*$/.test(line)){ flush(); blocks.push({type:'hr'}); continue; }
    if((m=line.match(/^(#{1,3})\s+(.*)/))){ flush(); blocks.push({type:'h', text:m[2].trim()}); continue; }
    if((m=line.match(/^\s*[-*]\s+(.*)/))){ if(listType!=='ul'){ flush(); listType='ul'; } listBuf.push(m[1].trim()); continue; }
    if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){ if(listType!=='ol'){ flush(); listType='ol'; } listBuf.push(m[1].trim()); continue; }
    if(!line.trim()){ flush(); continue; }
    flush(); blocks.push({type:'p', text:line.trim()});
  }
  flush();
  return blocks;
}

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// 把一段含 **加粗** 的文本拆成 segments: [{t, bold}]
function splitBold(text){
  const segs = [];
  const re = /\*\*([^*]+)\*\*/g;
  let last = 0, m;
  while((m = re.exec(text))){
    if(m.index > last) segs.push({t: text.slice(last, m.index), bold:false});
    segs.push({t: m[1], bold:true});
    last = m.index + m[0].length;
  }
  if(last < text.length) segs.push({t: text.slice(last), bold:false});
  return segs.length ? segs : [{t:text, bold:false}];
}

// 足球烯 logo 图片（供长图 canvas 使用，从页面 symbol 转出）
let FOOTBALLENE_IMG = null;
let FOOTBALLENE_PROMISE = null;
function ensureFootballene(){
  if(FOOTBALLENE_IMG && FOOTBALLENE_IMG.complete && FOOTBALLENE_IMG.naturalWidth > 0){
    return Promise.resolve(FOOTBALLENE_IMG);
  }
  if(FOOTBALLENE_PROMISE) return FOOTBALLENE_PROMISE;
  FOOTBALLENE_PROMISE = new Promise((resolve, reject) => {
    const sym = document.getElementById('footballene');
    if(!sym){ FOOTBALLENE_PROMISE = null; reject(new Error('no footballene symbol')); return; }
    const svgStr = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' + sym.innerHTML + '</svg>';
    const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
    const img = new Image();
    img.onload = function(){ FOOTBALLENE_IMG = img; resolve(img); };
    img.onerror = function(){ FOOTBALLENE_PROMISE = null; reject(new Error('footballene load fail')); };
    img.src = dataUrl;
  });
  return FOOTBALLENE_PROMISE;
}

function renderShareImage(userText, aiMd, nick){
  const W = 750, PAD = 46;
  const blocks = mdToBlocks(aiMd);

  // 字体常量
  const F_TITLE = 'bold 42px -apple-system,"PingFang SC",sans-serif';
  const F_SUB = '22px -apple-system,"PingFang SC",sans-serif';
  const F_HEAD = 'bold 30px -apple-system,"PingFang SC",sans-serif';
  const F_BODY = '27px -apple-system,"PingFang SC",sans-serif';
  const F_BODY_B = 'bold 27px -apple-system,"PingFang SC",sans-serif';
  const F_TAG = '22px -apple-system,"PingFang SC",sans-serif';
  const F_FOOT = '21px -apple-system,"PingFang SC",sans-serif';

  const COL_BG1 = '#0a0e22', COL_BG2 = '#151030';
  const COL_TEXT = '#eceefb', COL_DIM = '#8d94b8', COL_ACC = '#3ee6ff';
  const COL_BUBBLE1 = '#7c6cff', COL_BUBBLE2 = '#a86cff';
  const COL_CARD = 'rgba(255,255,255,0.05)', COL_LINE = 'rgba(255,255,255,0.14)';

  // 先建一个测量 canvas
  const meas = document.createElement('canvas').getContext('2d');

  function wrapText(ctx, text, maxW){
    const lines = [];
    let cur = '';
    for(const ch of text){
      if(ctx.measureText(cur + ch).width > maxW && cur){
        lines.push(cur); cur = ch;
      } else cur += ch;
    }
    if(cur) lines.push(cur);
    return lines;
  }

  // 计算用户问题气泡高度
  meas.font = F_BODY;
  const userLines = wrapText(meas, userText, W - PAD*2 - 64);
  const userBoxH = userLines.length * 40 + 34;

  // 先算总高度：第一次遍历，累计所有块的高度
  const contentMaxW = W - PAD*2 - 24; // AI 卡片内可用宽度
  let aiH = 0;
  const measured = [];
  for(const b of blocks){
    if(b.type === 'hr'){ aiH += 26; measured.push({type:'hr'}); }
    else if(b.type === 'h'){
      meas.font = F_HEAD;
      const ls = wrapText(meas, b.text, contentMaxW);
      aiH += ls.length * 42 + 12;
      measured.push({type:'h', lines:ls});
    }
    else if(b.type === 'p'){
      meas.font = F_BODY;
      const ls = wrapText(meas, b.text, contentMaxW);
      aiH += ls.length * 40 + 6;
      measured.push({type:'p', lines:ls});
    }
    else if(b.type === 'ul' || b.type === 'ol'){
      const items = [];
      let h = 0;
      for(const it of b.items){
        meas.font = F_BODY;
        const ls = wrapText(meas, it, contentMaxW - 40);
        items.push(ls);
        h += ls.length * 40 + 10;
      }
      aiH += h + 8;
      measured.push({type:b.type, items});
    }
  }

  // 卡片高度 = 内边距 + 内容
  const aiCardH = aiH + 40;
  const aiSectionH = aiCardH + 46; // 含"AI万sir的回答"标签

  // 总高度
  const H = PAD            // 顶部留白
    + 60 + 40              // logo 区
    + 22 + 12              // 标题区（标题+副标题）
    + 24                   // 分隔线
    + 30 + 22              // "问题"标签
    + userBoxH             // 用户气泡
    + 20                   // 间距
    + aiSectionH           // AI 分析区
    + 30                   // 底部间距
    + 34 + 30              // 底部文字
    + PAD;                 // 底部留白

  // 创建正式 canvas
  const canvas = document.createElement('canvas');
  const scale = 1;
  canvas.width = W;
  canvas.height = Math.ceil(H);
  const ctx = canvas.getContext('2d');

  // 背景渐变
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, COL_BG1);
  bg.addColorStop(1, COL_BG2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  let y = PAD;

  // logo（足球烯，从页面 symbol 转图片绘制）
  const logoR = 30;
  if(FOOTBALLENE_IMG && FOOTBALLENE_IMG.complete && FOOTBALLENE_IMG.naturalWidth > 0){
    ctx.drawImage(FOOTBALLENE_IMG, PAD, y, logoR*2, logoR*2);
  } else {
    // 回退：渐变圆 + 太阳图标
    const lg = ctx.createLinearGradient(PAD, y, PAD+logoR*2, y+logoR*2);
    lg.addColorStop(0, COL_BUBBLE1);
    lg.addColorStop(1, COL_BUBBLE2);
    ctx.fillStyle = lg;
    roundRect(ctx, PAD, y, logoR*2, logoR*2, 14);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(PAD+logoR, y+logoR, 9, 0, Math.PI*2);
    ctx.stroke();
    for(let i=0;i<8;i++){
      const a = i*Math.PI/4;
      const x1 = PAD+logoR + Math.cos(a)*14, y1 = y+logoR + Math.sin(a)*14;
      const x2 = PAD+logoR + Math.cos(a)*20, y2 = y+logoR + Math.sin(a)*20;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
  }
  // 标题文字
  ctx.fillStyle = '#fff';
  ctx.font = F_TITLE;
  ctx.fillText('思维教练', PAD + logoR*2 + 22, y + 44);
  ctx.fillStyle = COL_DIM;
  ctx.font = F_SUB;
  ctx.fillText('AI万sir', PAD + logoR*2 + 22, y + 78);
  y += logoR*2 + 26;

  // 分隔线
  ctx.strokeStyle = COL_LINE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(PAD, y);
  ctx.lineTo(W-PAD, y);
  ctx.stroke();
  y += 34;

  // 问题标签
  ctx.fillStyle = COL_ACC;
  ctx.font = F_TAG;
  ctx.fillText((nick || '我') + '的问题', PAD, y);
  y += 30;

  // 用户气泡（右对齐）
  const bubbleW = W - PAD*2;
  const bubbleX = PAD;
  const bubbleY = y;
  const bbg = ctx.createLinearGradient(bubbleX, bubbleY, bubbleX+bubbleW, bubbleY);
  bbg.addColorStop(0, COL_BUBBLE1);
  bbg.addColorStop(1, COL_BUBBLE2);
  ctx.fillStyle = bbg;
  roundRect(ctx, bubbleX, bubbleY, bubbleW, userBoxH, 20);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = F_BODY;
  let ty = bubbleY + 40;
  for(const l of userLines){
    ctx.fillText(l, bubbleX + 28, ty);
    ty += 40;
  }
  y = bubbleY + userBoxH + 26;

  // "AI万sir的回答"标签
  ctx.fillStyle = COL_ACC;
  ctx.font = F_TAG;
  ctx.fillText('AI万sir的回答', PAD, y);
  y += 30;

  // AI 卡片
  const cardX = PAD;
  const cardY = y;
  ctx.fillStyle = COL_CARD;
  roundRect(ctx, cardX, cardY, W - PAD*2, aiCardH, 20);
  ctx.fill();
  ctx.strokeStyle = COL_LINE;
  ctx.lineWidth = 1.5;
  roundRect(ctx, cardX, cardY, W - PAD*2, aiCardH, 20);
  ctx.stroke();

  let cy = cardY + 34;
  const tx = cardX + 28;
  let mi = 0;
  for(const b of blocks){
    const m = measured[mi++];
    if(b.type === 'hr'){
      ctx.strokeStyle = COL_LINE;
      ctx.beginPath();
      ctx.moveTo(tx, cy + 10);
      ctx.lineTo(cardX + (W-PAD*2) - 28, cy + 10);
      ctx.stroke();
      cy += 26;
    } else if(b.type === 'h'){
      ctx.fillStyle = '#fff';
      ctx.font = F_HEAD;
      const hs = splitBold(b.text);
      let hx = tx;
      for(const s of hs){
        ctx.fillStyle = s.bold ? COL_ACC : '#fff';
        ctx.fillText(s.t, hx, cy);
        hx += ctx.measureText(s.t).width;
      }
      cy += m.lines.length * 42 + 8;
    } else if(b.type === 'p'){
      ctx.fillStyle = '#d6d9ec';
      ctx.font = F_BODY;
      for(const l of m.lines){
        let lx = tx;
        for(const s of splitBold(l)){
          ctx.font = s.bold ? F_BODY_B : F_BODY;
          ctx.fillStyle = s.bold ? COL_ACC : '#d6d9ec';
          ctx.fillText(s.t, lx, cy);
          lx += ctx.measureText(s.t).width;
        }
        cy += 40;
      }
      cy += 4;
    } else if(b.type === 'ul' || b.type === 'ol'){
      let idx = 0;
      for(const ls of m.items){
        ctx.fillStyle = COL_BUBBLE2;
        ctx.font = F_BODY;
        ctx.fillText(b.type === 'ol' ? (idx+1)+'.' : '•', tx, cy);
        const itemX = tx + 30;
        for(const l of ls){
          let lx = itemX;
          for(const s of splitBold(l)){
            ctx.font = s.bold ? F_BODY_B : F_BODY;
            ctx.fillStyle = s.bold ? COL_ACC : '#d6d9ec';
            ctx.fillText(s.t, lx, cy);
            lx += ctx.measureText(s.t).width;
          }
          cy += 40;
        }
        cy += 8;
        idx++;
      }
    }
  }

  // 底部
  y = H - PAD - 30;
  ctx.fillStyle = COL_DIM;
  ctx.font = F_FOOT;
  ctx.textAlign = 'center';
  ctx.fillText('AI 辅助思考 · 不替代专业意见 · 高风险决策请谨慎', W/2, y);
  ctx.fillStyle = '#5c6286';
  ctx.fillText('think.techdly.com', W/2, y + 30);
  ctx.textAlign = 'left';

  return canvas;
}

</script>
<script>
(function(){
  const WELCOME = "你好，我是**万sir**，像军师一样陪在你身边的思考伙伴。\n\n基于万维钢老师《现代思维工具100讲》，我帮你分析决策、判断风险、规划成长。\n\n你可以问我任何让你纠结的问题——比如：\n- 「我该不该辞掉稳定的工作去创业？」\n- 「怎么判断现在是换赛道的好时机？」\n- 「这笔钱该投进去还是再等等？」\n- 「我最近状态很差，问题出在哪？」\n\n我会挑最合适的思维工具帮你拆解，给出结论、讲清机制，最后落到**具体能做的行动**上。\n\n试试看，把最近纠结的一件事告诉我。";

  const $ = s => document.querySelector(s);
  const chat = $('#chat'), input = $('#input'), send = $('#send');
  const gate = $('#gate'), passcode = $('#passcode'), gateBtn = $('#gateBtn'), gateErr = $('#gateErr');
  const passWrap = $('#passWrap'), nickWrap = $('#nickWrap'), nicknameInput = $('#nickname'), nickBtn = $('#nickBtn'), nickErr = $('#nickErr');
  const headNick = $('#headNick');

  let history = [];   // 当前会话的 messages（引用 activeSession().messages）
  let sessions = [];  // 所有会话 [{id, title, created, messages}]
  let activeId = null;
  let nickname = localStorage.getItem('tc_nickname') || '';
  let busy = false;
  let syncing = false;

  // ===== 云端历史（GitHub 仓库，按昵称隔离，多会话）=====
  async function loadCloudHistory(nick){
    const r = await fetch('/api/history?nickname=' + encodeURIComponent(nick));
    if(!r.ok) return [];
    const j = await r.json();
    const h = j.history;
    if(Array.isArray(h)){  // 兼容旧版单数组格式
      const msgs = h.filter(m => m && m.content && (m.role==='user'||m.role==='assistant'));
      return msgs.length ? [{ id:'s'+Date.now(), title:'', created:Date.now(), messages:msgs }] : [];
    }
    if(h && Array.isArray(h.sessions)) return h.sessions;
    return [];
  }
  async function saveCloudHistory(nick, sess){
    await fetch('/api/history', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nickname: nick, history: { sessions: sess } })
    });
  }
  function debouncedSave(){
    if(syncing) return;
    syncing = true;
    setTimeout(async ()=>{
      try { await saveCloudHistory(nickname, sessions); } catch(e){ console.error('保存历史失败', e); }
      syncing = false;
    }, 600);
  }

  // ===== 会话管理 =====
  function newSession(){
    return { id: 's'+Date.now()+Math.random().toString(36).slice(2,6), title:'', created:Date.now(), messages:[] };
  }
  function activeSession(){ return sessions.find(s => s.id === activeId) || null; }
  function setActive(id){
    activeId = id;
    localStorage.setItem('tc_active', id);
    const s = activeSession();
    history = s ? s.messages : [];
  }

  // ===== 口令 + 昵称 =====
  function restoreHistory(){
    let lastUser = null;
    history.forEach((msg, i) => {
      if(msg.role === 'user'){
        lastUser = msg.content;
        const m = document.createElement('div'); m.className='msg user';
        m.innerHTML = '<div class="msg-body"><div class="msg-name"></div><div class="bubble"></div></div><div class="avatar u-avatar"></div>';
        m.querySelector('.msg-name').textContent = nickname || '我';
        m.querySelector('.u-avatar').textContent = (nickname || '我').slice(0,1);
        m.querySelector('.bubble').textContent = msg.content;
        m.querySelector('.bubble').addEventListener('click', ()=> editUserMsg(msg.content));
        m.dataset.i = i;
        chat.appendChild(m);
      } else if(msg.role === 'assistant'){
        const m = document.createElement('div'); m.className='msg ai';
        m.innerHTML = '<div class="avatar a-avatar"><svg viewBox="0 0 512 512"><use href="#footballene"/></svg></div><div class="msg-body"><div class="msg-name">AI万sir</div><div class="bubble"></div></div>';
        m.dataset.i = i;
        renderMd(m.querySelector('.bubble'), msg.content, lastUser);
        chat.appendChild(m);
      }
    });
    scrollBottom();
  }
  async function enterApp(){
    let loaded = [];
    try { loaded = await loadCloudHistory(nickname); } catch(e){ loaded = []; }
    sessions = loaded;
    if(!sessions.length){ sessions.push(newSession()); }
    const saved = localStorage.getItem('tc_active');
    setActive((saved && sessions.find(s => s.id === saved)) ? saved : sessions[0].id);
    headNick.textContent = nickname || '';
    gate.classList.add('hide');
    chat.innerHTML = '';
    if(history.length){ restoreHistory(); }
    else { addAiMsg(WELCOME, false); }
  }
  function showNickInput(){
    passWrap.style.display = 'none';
    nickWrap.style.display = 'block';
    nicknameInput.focus();
  }
  function tryUnlock(){
    const code = passcode.value.trim();
    if(!code){ gateErr.classList.add('show'); return; }
    fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ passcode:code, question:'' })
    }).then(r=>{
      if(r.status === 400){ // 口令正确（仅问题为空）
        localStorage.setItem('tc_pass', code);
        if(nickname){ enterApp(); }
        else { showNickInput(); }
      } else {
        gateErr.classList.add('show');
      }
    }).catch(()=>{ gateErr.classList.add('show'); });
  }
  gateBtn.addEventListener('click', tryUnlock);
  passcode.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  nickBtn.addEventListener('click', async ()=>{
    const nick = nicknameInput.value.trim();
    if(!nick){ nickErr.classList.add('show'); return; }
    nickname = nick;
    localStorage.setItem('tc_nickname', nick);
    nickBtn.disabled = true;
    nickBtn.textContent = '加载中…';
    await enterApp();
    nickBtn.disabled = false;
    nickBtn.textContent = '开始使用';
  });
  nicknameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') nickBtn.click(); });
  headNick.addEventListener('click', ()=>{
    if(!nickname) return;
    if(!confirm('切换昵称？当前「' + nickname + '」的历史已存云端，换回同名即可找回。')) return;
    localStorage.removeItem('tc_nickname');
    nickname = '';
    chat.innerHTML = '';
    headNick.textContent = '';
    gate.classList.remove('hide');
    showNickInput();
  });

  // ===== 消息渲染 =====
  function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

  function addUserMsg(text){
    const m = document.createElement('div'); m.className='msg user';
    m.innerHTML = '<div class="msg-body"><div class="msg-name"></div><div class="bubble"></div></div><div class="avatar u-avatar"></div>';
    m.querySelector('.msg-name').textContent = nickname || '我';
    m.querySelector('.u-avatar').textContent = (nickname || '我').slice(0,1);
    m.querySelector('.bubble').textContent = text;
    m.querySelector('.bubble').addEventListener('click', ()=> editUserMsg(text));
    chat.appendChild(m); scrollBottom();
    history.push({role:'user', content:text});
    m.dataset.i = history.length - 1;
    debouncedSave();
  }

  function addAiMsg(md, animate){
    const m = document.createElement('div'); m.className='msg ai';
    m.innerHTML = '<div class="avatar a-avatar"><svg viewBox="0 0 512 512"><use href="#footballene"/></svg></div><div class="msg-body"><div class="msg-name">AI万sir</div><div class="bubble"></div></div>';
    const bubble = m.querySelector('.bubble');
    if(animate){
      bubble.classList.add('streaming');
      bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    } else {
      renderMd(bubble, md);
    }
    chat.appendChild(m); scrollBottom();
    return bubble;
  }

  function renderMd(el, md, userQuestion){
    el.classList.remove('streaming');
    el.innerHTML = '<div class="ai-md">' + (md2html(md) || '') + '</div>';
    if(userQuestion && md){
      const bar = document.createElement('div');
      bar.className = 'msg-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'act-btn';
      copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制';
      copyBtn.onclick = function(){ copyText(md2text(md)); };
      bar.appendChild(copyBtn);
      const shareBtn = document.createElement('button');
      shareBtn.className = 'act-btn';
      shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>分享';
      shareBtn.onclick = function(){ showShare(userQuestion, md); };
      bar.appendChild(shareBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'act-btn';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除';
      delBtn.onclick = function(){ deleteRound(el); };
      bar.appendChild(delBtn);
      el.appendChild(bar);
    }
    scrollBottom();
  }

  // ===== 分享长图 =====
  async function showShare(userText, aiMd){
    try {
      await ensureFootballene();
      const canvas = renderShareImage(userText, aiMd, nickname);
      const img = document.getElementById('shareImg');
      // 用 data URL（完整 base64）而非 blob URL：微信长按保存 blob URL 会截断成半截
      img.src = canvas.toDataURL('image/png');
      document.getElementById('shareModal').classList.add('show');
    } catch(e) {
      console.error('生成分享图失败', e);
    }
  }

  // ===== 复制 =====
  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(ok ? '已复制到剪贴板' : '复制失败，请长按选择复制');
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=> toast('已复制到剪贴板')).catch(()=> fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  // ===== 删除这轮问答 =====
  function deleteRound(bubble){
    const aiEl = bubble.parentElement;  // .msg.ai
    const aiIdx = parseInt(aiEl.dataset.i || '-1', 10);
    if(aiIdx < 0 || aiIdx >= history.length) return;
    if(!confirm('删除这条回答（连同你的问题）？')) return;
    const delIdxs = [aiIdx];
    if(aiIdx > 0 && history[aiIdx-1] && history[aiIdx-1].role === 'user') delIdxs.push(aiIdx-1);
    delIdxs.sort((a,b)=>b-a).forEach(i=> history.splice(i,1));
    chat.innerHTML = '';
    if(history.length){ restoreHistory(); }
    else { addAiMsg(WELCOME, false); }
    debouncedSave();
    toast('已删除');
  }

  // ===== 点击自己的问题 → 回填重新编辑 =====
  function editUserMsg(text){
    input.value = text;
    input.focus();
    autoGrow();
    scrollBottom();
    toast('已回填，修改后点发送即可重新提问');
  }

  // ===== 发送 =====
  function doSend(){
    const q = input.value.trim();
    if(!q || busy) return;
    busy = true; send.disabled = true;
    addUserMsg(q);
    const sess = activeSession();
    if(sess && !sess.title){ sess.title = q.slice(0, 20); }
    input.value = ''; autoGrow();

    const bubble = addAiMsg('', true);
    let acc = '';

    const hist = history.slice(-8); // 含刚 push 的 user 消息

    fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ passcode: localStorage.getItem('tc_pass')||'', question:q, history:hist })
    }).then(async r=>{
      if(!r.ok){
        let msg = '出错了';
        try{ const j = await r.json(); msg = j.error || msg; }catch(e){}
        renderMd(bubble, '⚠️ **' + msg + '**');
        history.push({role:'assistant', content: msg});
        debouncedSave();
        return;
      }
      // 流式读取
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let first = true;
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        if(first){ bubble.classList.remove('streaming'); bubble.textContent=''; first=false; }
        acc += dec.decode(value, {stream:true});
        bubble.textContent = acc;
        scrollBottom();
      }
      renderMd(bubble, acc, q);
      history.push({role:'assistant', content: acc});
      bubble.parentElement.dataset.i = history.length - 1;
      debouncedSave();
    }).catch(e=>{
      renderMd(bubble, '⚠️ 网络错误，请重试');
    }).finally(()=>{
      busy = false; send.disabled = false; input.focus();
    });
  }

  send.addEventListener('click', doSend);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); doSend(); }
  });
  input.addEventListener('input', ()=>{ send.disabled = !input.value.trim() || busy; autoGrow(); });

  function autoGrow(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,120)+'px';
  }

  function newChat(){
    const s = newSession();
    sessions.unshift(s);
    setActive(s.id);
    chat.innerHTML = '';
    addAiMsg(WELCOME, false);
    debouncedSave();
  }
  $('#clearBtn').addEventListener('click', ()=>{
    if(busy) return;
    newChat();
  });

  // ===== 历史会话列表 =====
  function fmtTime(ts){
    const d = new Date(ts), now = new Date();
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    if(d.toDateString() === now.toDateString()) return '今天 ' + hh + ':' + mm;
    if(new Date(now.getFullYear(), now.getMonth(), now.getDate()-1).toDateString() === d.toDateString()) return '昨天 ' + hh + ':' + mm;
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
  }
  function renderSessions(){
    const list = $('#sessionList');
    list.innerHTML = '';
    if(!sessions.length){
      list.innerHTML = '<div class="session-empty">还没有会话记录</div>';
      return;
    }
    sessions.forEach(s => {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === activeId ? ' active' : '');
      item.innerHTML = '<div class="s-title"><div class="s-name"></div><div class="s-meta"></div></div><button class="s-del">删除</button>';
      item.querySelector('.s-name').textContent = s.title || '（新对话）';
      item.querySelector('.s-meta').textContent = fmtTime(s.created) + ' · ' + s.messages.length + ' 条';
      item.querySelector('.s-del').addEventListener('click', (e)=>{
        e.stopPropagation();
        if(confirm('删除这个会话？')) deleteSession(s.id);
      });
      item.addEventListener('click', ()=> switchSession(s.id));
      list.appendChild(item);
    });
  }
  function switchSession(id){
    setActive(id);
    chat.innerHTML = '';
    if(history.length){ restoreHistory(); }
    else { addAiMsg(WELCOME, false); }
    closeSessions();
  }
  function deleteSession(id){
    sessions = sessions.filter(s => s.id !== id);
    if(!sessions.length){ sessions.push(newSession()); }
    if(activeId === id){ setActive(sessions[0].id); }
    chat.innerHTML = '';
    if(history.length){ restoreHistory(); }
    else { addAiMsg(WELCOME, false); }
    debouncedSave();
    renderSessions();
  }
  function openSessions(){ renderSessions(); $('#sessionModal').classList.add('show'); }
  function closeSessions(){ $('#sessionModal').classList.remove('show'); }
  $('#histBtn').addEventListener('click', openSessions);
  $('#sessionClose').addEventListener('click', closeSessions);
  $('#sessionNewBtn').addEventListener('click', ()=>{ newChat(); closeSessions(); });
  $('#sessionModal').addEventListener('click', (e)=>{ if(e.target === document.getElementById('sessionModal')) closeSessions(); });

  // 分享弹窗事件
  const shareModal = document.getElementById('shareModal');
  $('#shareClose').addEventListener('click', ()=>{ shareModal.classList.remove('show'); });
  shareModal.addEventListener('click', (e)=>{ if(e.target === shareModal) shareModal.classList.remove('show'); });

  // 记住本次会话输入的口令（仅内存，用于后续请求）
  passcode.addEventListener('input', ()=>{ localStorage.setItem('tc_pass', passcode.value.trim()); });

  input.focus();
})();
</script>
